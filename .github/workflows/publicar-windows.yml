name: Compilar y publicar Protone para Windows
run-name: Protone Windows · ${{ inputs.source_ref || 'orden de publicación' }}
on:
  push:
    branches: [publicar-instalador]
    paths: ['.github/publicacion.json']
  workflow_dispatch:
    inputs:
      source_ref:
        description: Rama, etiqueta o SHA de fgilalar/protone-codigo (usar el SHA para reproducir una versión)
        required: true
        default: main
        type: string
      publish:
        description: Publicar una nueva Release al terminar (no reemplaza versiones existentes)
        required: true
        default: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: protone-windows-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}
    steps:
      - name: Leer configuración de publicación
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: .release-control
          persist-credentials: false
      - name: Resolver orden de publicación
        id: request
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          MANUAL_SOURCE_REF: ${{ inputs.source_ref }}
        run: node .release-control/scripts/resolve-publication.cjs
      - name: Comprobar acceso al código privado
        shell: pwsh
        env:
          CODE_READ_TOKEN: ${{ secrets.PROTONE_CODE_READ_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CODE_READ_TOKEN)) {
            throw 'Falta el secreto PROTONE_CODE_READ_TOKEN en Protone-descargas. Crea un token de solo lectura (Contents: Read-only) para protone-codigo y guárdalo como secreto de Actions.'
          }
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: fgilalar/protone-codigo
          ref: ${{ steps.request.outputs.source_ref }}
          token: ${{ secrets.PROTONE_CODE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Identificar versión y revisión
        id: metadata
        env:
          EXPECTED_VERSION: ${{ steps.request.outputs.expected_version }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+(-rc\.\d+)?$') { throw 'Usa X.Y.Z o X.Y.Z-rc.N' }
          if ($env:EXPECTED_VERSION -and $version -ne $env:EXPECTED_VERSION) { throw 'La versión del código no coincide con la orden de publicación' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "source_sha=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Ejecutar pruebas
        run: npm test
      - name: Compilar instalador
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist -- --publish never
      - name: Inventario de dependencias de compilación
        run: npm sbom --sbom-format cyclonedx > dist/SBOM.cdx.json
      - name: Preparar comprobación de integridad
        shell: pwsh
        run: |
          if (!(Test-Path dist/Protone-Setup.exe)) { throw 'No se ha generado Protone-Setup.exe' }
          $hash = (Get-FileHash dist/Protone-Setup.exe -Algorithm SHA256).Hash.ToLower()
          $files = 'Protone-Setup.exe','SBOM.cdx.json'
          $records = foreach ($file in $files) { $h = (Get-FileHash "dist/$file" -Algorithm SHA256).Hash.ToLower(); "$h  $file" }
          $records | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          @{schema=1;application='Protone';version='${{ steps.metadata.outputs.version }}';source_sha='${{ steps.metadata.outputs.source_sha }}';runner=$env:RUNNER_OS;node=(node --version);lock_sha256=(Get-FileHash package-lock.json -Algorithm SHA256).Hash.ToLower();installer_sha256=$hash} | ConvertTo-Json | Set-Content dist/provenance.json -Encoding utf8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Protone-Windows-${{ steps.metadata.outputs.version }}
          path: |
            dist/Protone-Setup.exe
            dist/SHA256SUMS.txt
            dist/SBOM.cdx.json
            dist/provenance.json
          if-no-files-found: error
          retention-days: 30
  publish:
    if: ${{ github.event_name == 'push' || inputs.publish }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Protone-Windows-${{ needs.build.outputs.version }}
          path: installer
      - name: Publicar en Protone-descargas
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: fgilalar/Protone-descargas
          VERSION: ${{ needs.build.outputs.version }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "La versión $tag ya existe. No se reemplazará; incrementa la versión del código."
            exit 1
          fi
          cat > notes.md <<NOTES
          Protone ${VERSION} — Haz que suene.

          Descarga **Protone-Setup.exe** para instalar la aplicación en Windows.
          Se incluye **SHA256SUMS.txt** para comprobar la integridad del instalador.

          Código utilizado: https://github.com/fgilalar/protone-codigo/commit/${SOURCE_SHA}
          Novedades: https://github.com/fgilalar/protone-codigo/blob/${SOURCE_SHA}/CAMBIOS.md

          Esta versión guarda proyectos .protone y permite abrir proyectos anteriores .json.
          El instalador no tiene firma digital.
          NOTES
          extra=(--latest)
          if [[ "$VERSION" == *-rc.* ]]; then extra=(--prerelease --latest=false); fi
          gh release create "$tag" installer/Protone-Setup.exe installer/SHA256SUMS.txt installer/SBOM.cdx.json installer/provenance.json "${extra[@]}" --target "$TARGET_SHA" --title "Protone ${VERSION}" --notes-file notes.md --draft
          gh release edit "$tag" --draft=false "${extra[@]}"
